[project]
name = "valorant-mcp"
version = "0.4.2"
description = "MCP server for Valorant match analysis via Henrik's API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "mcp[cli]>=1.26,<2",
    "httpx",
    "pydantic",
    "pydantic_settings",
]

[build-system]
requires = ["hatchling"]                                                                            
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
]

[project.scripts]
valorant-mcp = "valorant_mcp.server:main"

[tool.pytest.ini_options]
markers = ["live: hits the real Henrik API (run with `uv run pytest -m live`)"]
addopts = "-m 'not live'"
